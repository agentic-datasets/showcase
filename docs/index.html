    <script>
      // Applied before first paint so a reader who chose a theme never sees the
      // other one flash. Deliberately duplicates ThemeToggle.tsx: by the time
      // the bundle runs, the wrong theme has already been painted.
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {}
      })()
    </script>
